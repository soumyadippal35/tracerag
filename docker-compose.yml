services:
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      TRAGERAG_AUTH_SECRET: ${TRAGERAG_AUTH_SECRET:-local-only-change-this-before-deploy}
      TRAGERAG_DB_PATH: /data/tracerag.db
      TRAGERAG_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - tracerag-data:/data
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  tracerag-data:
